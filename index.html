<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ying Yang animacio cucc idk</title>
    <link rel="stylesheet" href="yingyang.css">
</head>

<body>

    <div class="col">
        <div class="yingyang">
            <div class="filler"></div>
            <div class="scndfiller"></div>
            <div class="ying">
                <div class="yingdot"></div>
            </div>
            <div class="yang">
                <div class="yangdot"></div>
            </div>
        </div>
        <div class="row">
            <button id="play">Playing</button>
            <button id="pause">Pause</button>
            <button id="slower">Slower</button>
            <button id="faster">Faster</button>
            <button id="bigger">Bigger</button>
            <button id="smaller">Smaller</button>
        </div>
        <button id="reset">In its original state currently</button>
    </div>

<script src="yingyang.js"></script>
</body>
</html>
